<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mai üzeneted ❤️</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #fff5ec, #fdeee2);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 18px;
    }

    p {
      font-size: 1.25rem;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .note {
      font-size: 0.9rem;
      color: #777;
      margin-bottom: 18px;
    }

    .help-btn {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 0.95rem;
      background: #e0a4a4;
      color: #5a1f1f;
      cursor: pointer;
    }

    .help-btn:active {
      transform: scale(0.97);
    }

    .hidden {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .music {
  margin-top: 18px;
}

.music-title {
  font-size: 0.9rem;
  color: #666;
  margin-bottom: 8px;
}

  </style>
</head>

<body>
  <div class="card">
    <h1 id="greeting"></h1>
    <p id="msg"></p>
    <div class="note">Ez az üzenet ma végig veled marad 🤍</div>
    <button id="hardBtn" class="help-btn" onclick="hardDay()">Nehéz napom van 🖤</button>
    <div class="music">
      <div class="music-title">🎧 Egy kis zene most</div>
      <iframe
  id="spotifyPlayer"
  width="100%"
  height="80"
  frameborder="0"
  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
</iframe>
</div>
</div>



  <script>
  const trackIds = [
    "3ZffCQKLFLUvYM59XKLbVm",
    "35MeePbBnryubkVG0v8GbI",
    "6cql9tbKhnwkqPyYV3arGN",
    "66Ceo7qZOyyX3J8AUsT2Vt",
    "5vBJF9zAYFeWxqkGXF583A",
    "55ikcenXPbQdzCnO1sOuYg",
    "2WfaOiMkCvy7F5fcp2zZ8L"
  ];

  // véletlenszerű index
  const randomIndex = Math.floor(Math.random() * trackIds.length);
  const trackId = trackIds[randomIndex];

  // Spotify iframe beállítása
  document.getElementById("spotifyPlayer").src =
    "https://open.spotify.com/embed/track/" +
    trackId +
    "?utm_source=generator";
    
    /* 🌅 Napszakos köszönés */
    const hour = new Date().getHours();
    let greeting = "Szia 🤍";
    if (hour >= 5 && hour < 9) greeting = "Jó reggelt 🤍";
    else if (hour < 12) greeting = "Szép napot 🤍";
    else if (hour < 18) greeting = "Szép délutánt 🤍";
    else greeting = "Szép estét 🤍";
    document.getElementById("greeting").innerText = greeting;

    /* 📅 Dátum */
    const today = new Date().toISOString().slice(0, 10);
    const day = new Date().getDay();
    const key = "dailyMessage_" + today;
    const hardKey = key + "_hard";

    /* 💌 Hét napjai */
    const weeklyMessages = {
      1: ["Hétfő van, de nem egyedül kezded.", "Nem kell mindent ma megoldani."],
      2: ["Már benne vagy – jól csinálod.", "Haladsz, akkor is, ha nem érzed."],
      3: ["Féltávnál jársz. Büszke vagyok rád."],
      4: ["Tarts ki, már közel a vége."],
      5: ["Megcsináltad. Jár a megkönnyebbülés."],
      6: ["Ma lassabban is lehet élni."],
      0: ["Ez a nap rólad szól 🤍"]
    };

    /* 🆘 Nehéz nap üzenetek */
    const hardDayMessages = [
      "Most nem kell erősnek lenned.",
      "Elég az is, ha csak átvészeled ezt a napot.",
      "Itt vagyok veled. Nem vagy egyedül.",
      "Ha ma csak lélegzel, az is elég.",
      "Ez a nap nem határoz meg téged."
    ];

    let message = localStorage.getItem(key);
    const hardUsed = localStorage.getItem(hardKey);

    if (!message) {
      const list = weeklyMessages[day];
      message = list[Math.floor(Math.random() * list.length)];
      localStorage.setItem(key, message);
    }

    document.getElementById("msg").innerText = message;

    if (hardUsed) {
      document.getElementById("hardBtn").classList.add("hidden");
    }

    function hardDay() {
      if (localStorage.getItem(hardKey)) return;

      const msg = hardDayMessages[Math.floor(Math.random() * hardDayMessages.length)];
      localStorage.setItem(key, msg);
      localStorage.setItem(hardKey, "true");
      document.getElementById("msg").innerText = msg;
      document.getElementById("hardBtn").classList.add("hidden");
    }
  </script>
</body>
</html>
