<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mai üzeneted ❤️</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #fff5ec, #fdeee2);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 18px;
    }

    p {
      font-size: 1.25rem;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .note {
      font-size: 0.9rem;
      color: #777;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 id="greeting"></h1>
    <p id="msg"></p>
    <div class="note">Ez az üzenet ma végig veled marad 🤍</div>
  </div>

  <script>
    /* 🌅 Napszakos köszönés */
    const hour = new Date().getHours();
    let greeting = "Szia 🤍";

    if (hour >= 5 && hour < 9) greeting = "Jó reggelt 🤍";
    else if (hour < 12) greeting = "Szép napot 🤍";
    else if (hour < 18) greeting = "Szép délutánt 🤍";
    else greeting = "Szép estét 🤍";

    document.getElementById("greeting").innerText = greeting;

    /* 📅 Hét napjai szerinti üzenetek */
    const weeklyMessages = {
      1: [ // Hétfő
        "Hétfő van, de nem egyedül kezded. ❤️",
        "Apró lépések is számítanak ma.",
        "Nem kell mindent ma megoldani."
      ],
      2: [ // Kedd
        "Már benne vagy – jól csinálod.",
        "A lendület lassan megjön.",
        "Eddig is ügyesen haladtál."
      ],
      3: [ // Szerda
        "Féltávnál jársz. Büszke vagyok rád.",
        "A kitartásod ma is dolgozik.",
        "Ez a nap is a tiéd."
      ],
      4: [ // Csütörtök
        "Már látszik a vége. Tarts ki 🤍",
        "Sokkal erősebb vagy, mint gondolod.",
        "Egy lépéssel közelebb vagy."
      ],
      5: [ // Péntek
        "Megcsináltad. Ma már könnyebb lesz.",
        "Jár a megkönnyebbülés 😌",
        "Büszke lehetsz a hetedre."
      ],
      6: [ // Szombat
        "Ma lehet lassabban élni.",
        "Pihenni is teljesítmény.",
        "Engedd meg magadnak a nyugalmat."
      ],
      0: [ // Vasárnap
        "Ez a nap rólad szól 🤍",
        "Nem kell sietni sehová.",
        "Gyűjts erőt a következő hétre."
      ]
    };

    /* 💌 Napi 1 üzenet logika */
    const today = new Date().toISOString().slice(0, 10);
    const day = new Date().getDay(); // 0 = vasárnap
    const key = "dailyMessage_" + today;

    let message = localStorage.getItem(key);

    if (!message) {
      const list = weeklyMessages[day];
      message = list[Math.floor(Math.random() * list.length)];
      localStorage.setItem(key, message);
    }

    document.getElementById("msg").innerText = message;
  </script>
</body>
</html>
