<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mai üzeneted ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #fff5ec, #fdeee2);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 18px;
    }

    p {
      font-size: 1.25rem;
      line-height: 1.5;
      margin: 0 0 26px 0;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      font-size: 1rem;
      background: #ff8a5c;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>💌 Mai üzeneted</h1>
    <p id="msg"></p>
    <button onclick="newMessage()">Új üzenetet kérek</button>
  </div>

  <script>
    const messages = [
      "Büszke vagyok rád. Jó helyen vagy. ❤️",
      "Ezt is meg fogod csinálni. Mint mindig.",
      "Egy ember biztosan ma is rád gondol. 😉",
      "Nem vagy egyedül. Veled vagyok fejben.",
      "A mosolyod ma is számít valakinek.",
      "Csak így tovább – pont elég vagy."
    ];

    function newMessage() {
      const random = Math.floor(Math.random() * messages.length);
      document.getElementById("msg").innerText = messages[random];
    }

    newMessage();
  </script>
</body>
</html>
