    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f0ded4, #e1c6bb, #cdb0a6);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 18px;
    }

    p {
      font-size: 1.25rem;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .note {
      font-size: 0.9rem;
      color: #777;
      margin-bottom: 18px;
    }

    .help-btn {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 0.95rem;
      background: #e0a4a4;
      color: #5a1f1f;
      cursor: pointer;
    }

    .help-btn:active {
      transform: scale(0.97);
    }

    .hidden {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .music {
  margin-top: 18px;
}

.music-title {
  font-size: 0.9rem;
  color: #666;
  margin-bottom: 8px;
}

  </style>
</head>
